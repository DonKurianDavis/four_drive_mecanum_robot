controller_manager:
  ros__parameters:
    update_rate: 30
    use_sim_time: true

    mecanum_drive:
      type: mecanum_drive_controller/MecanumDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

mecanum_drive:
    ros__parameters:
      reference_timeout: 5.0

      front_left_wheel_command_joint_name: "front_left_joint"
      front_right_wheel_command_joint_name: "front_right_joint"
      rear_right_wheel_command_joint_name: "rear_right_joint"
      rear_left_wheel_command_joint_name: "rear_left_joint"

      kinematics:
        base_frame_offset: { x: 1.0, y: 2.0, theta: 3.0 }
        wheels_radius: 0.103
        sum_of_robot_center_projection_on_X_Y_axis: 0.620

      base_frame_id: "base_link"
      odom_frame_id: "odom"
      enable_odom_tf: true
      pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
      twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
